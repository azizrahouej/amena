name: Garder AMENA éveillée
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Réveiller le service
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://amena.onrender.com/api/sante -o /dev/null
