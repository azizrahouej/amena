    <circle cx="200" cy="190" r="4"/><circle cx="186" cy="214" r="4"/><circle cx="214" cy="214" r="4"/><circle cx="200" cy="238" r="4"/>
    <circle cx="100" cy="300" r="4"/><circle cx="86" cy="324" r="4"/><circle cx="114" cy="324" r="4"/><circle cx="100" cy="348" r="4"/>
